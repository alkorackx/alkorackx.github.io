<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliper — retour TikTok</title>
<!--
  Page de rebond pour l'autorisation TikTok.

  TikTok refuse « http://localhost » comme URL de redirection, même en Sandbox.
  Cette page, elle, est sur un domaine vérifié en HTTPS : TikTok accepte de s'y
  rendre. Elle se contente de renvoyer le code d'autorisation vers le panel
  Cliper, qui tourne sur la machine de l'utilisateur.

  Un navigateur autorise une navigation de premier niveau d'une page HTTPS vers
  « http://localhost » — la règle du contenu mixte ne vise que les
  sous-ressources. Le renvoi fonctionne donc sans avertissement.

  Rien n'est envoyé ailleurs : le code ne quitte pas le navigateur, et cette
  page n'a aucun serveur derrière elle.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center;
         gap: 14px; text-align: center; padding: 24px;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0d0f16; color: #e8eaf2; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  p { margin: 0; color: #9aa1b8; max-width: 34rem; }
  code { background: #1d2130; padding: 3px 7px; border-radius: 6px;
         font-size: 13px; color: #22d3ee; word-break: break-all; }
  .code-box { display: grid; gap: 10px; margin-top: 6px; }
  button { font: inherit; font-weight: 560; padding: 9px 16px; border: 0;
           border-radius: 9px; background: #7c5cff; color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  .err { color: #f87171; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="attente">
  <h1>Retour de TikTok…</h1>
  <p>Renvoi vers Cliper sur ta machine.</p>
</div>

<div id="manuel" hidden>
  <h1>Copie ce code dans Cliper</h1>
  <p>Le panel n'a pas répondu — il n'est peut-être pas démarré, ou il écoute sur
     un autre port. Ouvre Cliper, va dans <b>Réglages → Compte TikTok</b>, clique
     <b>Coller un code</b> et colle ceci :</p>
  <div class="code-box">
    <code id="code"></code>
    <button id="copier">Copier le code</button>
  </div>
</div>

<div id="refus" hidden>
  <h1 class="err">Autorisation refusée</h1>
  <p id="raison"></p>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  var erreur = params.get('error');

  function montrer(id) {
    ['attente', 'manuel', 'refus'].forEach(function (x) {
      document.getElementById(x).hidden = (x !== id);
    });
  }

  if (erreur) {
    document.getElementById('raison').textContent =
      params.get('error_description') || erreur;
    montrer('refus');
    return;
  }

  if (!code) {
    document.getElementById('raison').textContent =
      "TikTok n'a renvoyé aucun code d'autorisation.";
    montrer('refus');
    return;
  }

  // Le port du panel peut être changé côté Cliper : on l'accepte en paramètre.
  var port = params.get('port') || '8420';
  var cible = 'http://localhost:' + port + '/api/tiktok/callback' + location.search;

  document.getElementById('code').textContent = code;
  document.getElementById('copier').addEventListener('click', function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById('copier').textContent = 'Copié';
    });
  });

  // Si le panel ne répond pas, la navigation échoue en silence : on repasse
  // donc à la saisie manuelle au bout de trois secondes.
  setTimeout(function () { montrer('manuel'); }, 3000);
  location.replace(cible);
})();
</script>

</body>
</html>
